<div x-ref="userdrop" @click.away="$refs.userdrop.classList.remove('is-active')" class="dropdown is-spaced is-right dropdown-trigger">
    <button @click="$refs.userdrop.classList.add('is-active')" aria-haspopup="true" aria-expanded="false">
        <a class="chat-nav-item is-account">
            <img class="user-avatar" src="https://via.placeholder.com/150x150" data-demo-src="/img/avatars/helen.jpg" alt="">
        </a>
    </button>
    <div class="dropdown-menu dropdown-menu-end" role="menu">
        <div class="dropdown-content">
            <div class="dropdown-item is-header">
                <h5 class="is-narrow">Helen Miller</h5>
                <span>helenmiller@wire.io</span>
            </div>
            <a href="#" class="dropdown-item">
                <div class="media">
                    <i data-feather="grid"></i>
                    <div class="media-content">
                        <h3>Dashboard</h3>
                        <span>Back to Dashboard.</span>
                    </div>
                </div>
            </a>
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="user"></i>
                    <div class="media-content">
                        <h3>Profile</h3>
                        <small>View your user profile.</small>
                    </div>
                </div>
            </a>
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="mail"></i>
                    <div class="media-content">
                        <h3>Inbox</h3>
                        <small>Open your messages inbox.</small>
                    </div>
                </div>
            </a>
            <hr class="dropdown-divider">
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="check"></i>
                    <div class="media-content">
                        <h3>Tasks</h3>
                        <small>View your pending tasks.</small>
                    </div>
                </div>
            </a>
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="box"></i>
                    <div class="media-content">
                        <h3>My Projects</h3>
                        <small>View your projects board.</small>
                    </div>
                </div>
            </a>
            <hr class="dropdown-divider">
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="log-out"></i>
                    <div class="media-content">
                        <h3>Logout</h3>
                        <small>Logout from your account</small>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
