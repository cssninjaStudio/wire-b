<div x-ref="settingsdrop" @click.away="$refs.settingsdrop.classList.remove('is-active')" class="dropdown is-spaced is-right dropdown-trigger">
    <button @click="$refs.settingsdrop.classList.add('is-active')" aria-haspopup="true" aria-expanded="false">
        <a class="chat-nav-item is-icon">
            <i data-feather="settings"></i>
        </a>
    </button>
    <div class="dropdown-menu dropdown-menu-end" role="menu">
        <div class="dropdown-content">
            <div class="dropdown-item is-header">
                <h5>Settings</h5>
            </div>
            <a href="#" class="dropdown-item">
                <div class="media">
                    <i data-feather="message-circle"></i>
                    <div class="media-content">
                        <h3>Details</h3>
                        <small>View this conversation's details.</small>
                    </div>
                </div>
            </a>
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="sliders"></i>
                    <div class="media-content">
                        <h3>Preferences</h3>
                        <small>Define your preferences.</small>
                    </div>
                </div>
            </a>
            <hr class="dropdown-divider">
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="bell"></i>
                    <div class="media-content">
                        <h3>Notifications</h3>
                        <small>Set notifications settings.</small>
                    </div>
                </div>
            </a>
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="more-horizontal"></i>
                    <div class="media-content">
                        <h3>Silence</h3>
                        <small>Disable notifications.</small>
                    </div>
                </div>
            </a>
            <hr class="dropdown-divider">
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="archive"></i>
                    <div class="media-content">
                        <h3>Archive</h3>
                        <small>Archive this conversation.</small>
                    </div>
                </div>
            </a>
            <a class="dropdown-item">
                <div class="media">
                    <i data-feather="trash-2"></i>
                    <div class="media-content">
                        <h3>Delete</h3>
                        <small>Delete this conversation.</small>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
