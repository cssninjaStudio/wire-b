<div id="add-conversation-modal" class="add-conversation-modal" :class="{
        'is-active': newConversationModalOpened,
        '': !newConversationModalOpened
    }">
    <div @click="toggleNewConversationModal()" class="inner"></div>

    <div class="new-conversation-panel">
        <h2>New Conversation</h2>
        <p class="mb-16">Select some users you want to chat with</p>

        <div class="form-group has-icon">
            <input class="form-control search-field" placeholder="Search users...">
            <div class="form-icon">
                <i data-feather="search"></i>
            </div>
            <div class="search-results has-slimscroll"></div>
        </div>

        <div class="selected-users">
            <div class="selected-users-placeholder">
                <div class="placeholder-content has-text-centered">
                    {{> users-placeholder}}
                    <h3>Add Users</h3>
                    <p>Select some users to add to your conversation.</p>
                </div>
            </div>
            <div class="selected-users-list has-slimscroll is-hidden"></div>
        </div>

        <div class="button-wrap">
            <button id="create-conversation-button" class="btn btn-primary">Create Conversation</button>
        </div>
    </div>
</div>
