<!-- Conversation -->
<div @click="switchConversation($event)" class="user-item" data-chat-user="mike" data-full-name="Mike Gaggio" data-status="Online" data-conversation="1" :class="{
        'is-active': activeConversation === 'conversation-1',
        '':  activeConversation != 'conversation-1'
    }">
    <div class="avatar-container">
        <img class="user-avatar" src="https://via.placeholder.com/150x150" data-demo-src="/img/avatars/mike.jpg" alt="">
        <div class="conversation-count">
            <span>3</span>
        </div>
    </div>
</div>
